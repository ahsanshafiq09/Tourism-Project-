<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallery - VisitPakistanNow</title>
  
  
  <style>
   
   .two-up{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    align-items:start;
  } 

   .two-up figure{margin:0}
  .two-up img{
    width:100%;
    height:220px;        /* fixed height so both look identical */
    object-fit:cover;    /* crop to fill without distortion */
    border-radius:6px;
    display:block;
  }
  .two-up figcaption{
    text-align:center;
    padding-top:8px;
    font-size:14px;
    color:#1cbd13;
    font-weight:bold;
  }
  @media (max-width:600px){
    .two-up{grid-template-columns:1fr} /* stack on small screens */
  }

    body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0}
    .navbar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#1cbd13;color:#fff}
    .navbar .logo a{color:#fff;text-decoration:none;font-weight:700}
    .navbar ul{list-style:none;display:flex;margin:0;padding:0}
    .navbar li{margin-left:16px}
    .navbar a{color:#fff;text-decoration:none}

    /* gallery layout and item styling */
    .gallery{padding:20px;display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-start}
    .gallery .gallery-item{
      padding:8px;
      font-size:14px;
      color:#1cbd13;
      font-weight:bold;
      box-sizing:border-box;
      width:calc(50% - 12px); /* two items per row */
      background:transparent;
      border-radius:6px;
    }
    .gallery .gallery-item img{
      display:block;
      width:100%;
      height:300px;              /* fixed box height for uniform layout */
      object-fit:cover;          /* crop to fill uniformly */
      border-radius:6px;
    }
    .gallery .gallery-item .meta{
      font-size:12px;color:#333;margin-top:6px;text-align:center;
    }
  </style>
</head>
<body>

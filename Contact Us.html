<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0}
    .navbar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#1cbd13;color:#fff}
    .navbar .logo a{color:#ffffff;text-decoration:none;font-weight:700}
    .navbar ul{list-style:none;display:flex;margin:0;padding:0}
    .navbar li{margin-left:16px}
    .navbar a{color:#ffffff;text-decoration:none}
    .container{padding:24px}
  </style>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .contact-container {
            max-width: 600px;
            margin: 60px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #1cbd13;
        }

        p {
            text-align: center;
            margin-bottom: 30px;
            color: #666;
        }

        form label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        form input,
        form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

            form input:focus,
            form textarea:focus {
                border-color: #1cbd13;
                outline: none;
            }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1cbd13;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

            button:hover {
                background: #1cbd13;
            }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
 <nav class="navbar" role="navigation" aria-label="Main navigation">
  <div class="brand"><a href="Home.html">VisitPakistanNow</a></div>
  <ul>
    <li><a href="Home.html">Home</a></li>
    <li><a href="Attractions.html">Attractions</a></li>
    <li><a href="Visa.html">Visa</a></li>
    <li><a href="Contact Us.html">Contact</a></li>
  </ul>
</nav>
    <div class="contact-container">
        <h1>Contact Us</h1>
        <p>We’d love to hear from you. Please fill out the form below.</p>

        <form action="#" method="post">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>

            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="Subject">

            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>

            <button type="submit">Send Message</button>
        </form>

        <div class="footer-text">
            VisitPakistanNow. All rights reserved (Designed And Built By Ahsan).
        </div>
    </div>

</body>
</html>
